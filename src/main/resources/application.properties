spring.application.name=practica-cloud


# Permite que AWS defina el puerto mediante una variable de entorno, o usa 8080 por defecto
server.port=${PORT:8080}
# ==========================================
# CONFIGURACIÓN DE BASE DE DATOS (AURORA/LARAGON)
# ==========================================
# Local (Laragon): jdbc:mysql://localhost:3306/tu_bd
# Producción (Aurora): jdbc:mysql://<endpoint-de-tu-cluster-aurora>:3306/tu_bd
spring.datasource.url=jdbc:mysql://localhost:3306/librodb
spring.datasource.username=admin
spring.datasource.password=

# Como es una práctica, esto crea/actualiza las tablas automáticamente según tus entidades Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# CONFIGURACIÓN DE AMAZON S3
# ==========================================
spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.credentials.access-key=TU_ACCESS_KEY_DE_AWS
spring.cloud.aws.credentials.secret-key=TU_SECRET_KEY_DE_AWS

# Habilita el endpoint de salud de Actuator para que AWS sepa que la app está viva
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always